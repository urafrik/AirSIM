name: Build unsigned iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'iOS/**'
      - '.github/workflows/ios-unsigned.yml'

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare build directory
        shell: bash
        run: echo "BUILD_DIR=$RUNNER_TEMP/airsim-ios" >> "$GITHUB_ENV"

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP=$(python3 - <<'PY'
          import glob, re
          apps = glob.glob('/Applications/Xcode_26*.app')
          if not apps:
              raise SystemExit('Xcode 26 is required for the existing Liquid Glass UI')
          print(max(apps, key=lambda p: tuple(map(int, re.findall(r'\d+', p)))))
          PY
          )
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
          mkdir -p "$BUILD_DIR"
          xcodebuild -version | tee "$BUILD_DIR/xcode-version.txt"

      - name: Verify certificate pins with real TLS handshakes
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy/direct-frp/generate_self_signed.py --host pin-test.example.test --out "$BUILD_DIR/pin-fixture"
          openssl x509 -in "$BUILD_DIR/pin-fixture/fullchain.pem" -outform DER -out "$BUILD_DIR/pin-fixture/server.der"
          python3 iOS/TLSPinSmoke/server.py "$BUILD_DIR/pin-fixture" &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          swiftc -swift-version 5 iOS/Shared/PinnedTLS.swift iOS/Shared/WatchCallPayload.swift iOS/TLSPinSmoke/main.swift -o "$BUILD_DIR/tls-pin-smoke"
          "$BUILD_DIR/tls-pin-smoke" "$BUILD_DIR/pin-fixture" 2>&1 | tee "$BUILD_DIR/tls-pin-tests.log"

      - name: Verify local stereo call recording
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          source = Path('iOS/AirSIM/AudioSessionController.swift').read_text()
          recorder = source.split('final class LocalCallPCMRecorder:', 1)[1].split('/// 管理 iPhone/iPad', 1)[0]
          Path(os.environ['BUILD_DIR'], 'LocalCallPCMRecorder.swift').write_text('import Foundation\nfinal class LocalCallPCMRecorder:' + recorder)
          PY
          swiftc -swift-version 5 "$BUILD_DIR/LocalCallPCMRecorder.swift" iOS/RecordingSmoke/main.swift -o "$BUILD_DIR/recording-smoke"
          "$BUILD_DIR/recording-smoke" | tee "$BUILD_DIR/recording-tests.log"

      - name: Verify HTTP completion and hangup lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy/direct-frp/generate_self_signed.py --host 127.0.0.1 --out "$BUILD_DIR/http-fixture"
          python3 iOS/HTTPTransportSmoke/server.py "$BUILD_DIR/http-fixture" &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          swiftc -parse-as-library -swift-version 5 iOS/Shared/PinnedTLS.swift iOS/AirSIM/WiredHTTPTransport.swift iOS/AirSIM/CallLifecycleStore.swift iOS/HTTPTransportSmoke/main.swift -o "$BUILD_DIR/http-smoke"
          "$BUILD_DIR/http-smoke" "$BUILD_DIR/http-fixture" | tee "$BUILD_DIR/http-tests.log"

      - name: Verify automatic routing and signal display
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          source = Path('iOS/AirSIM/VoWLANController.swift').read_text()
          endpoint = source.split('struct VoWLANEndpoint:', 1)[1].split('struct VoWLANDiscoveredAgent:', 1)[0]
          config = source.split('enum ManualDirectConfiguration {', 1)[1].split('@MainActor\nenum VoWLANProbeRecovery', 1)[0]
          Path(os.environ['BUILD_DIR'], 'RoutingFixture.swift').write_text('import Foundation\nimport Network\nstruct VoWLANEndpoint:' + endpoint + 'enum ManualDirectConfiguration {' + config)
          PY
          swiftc -parse-as-library -swift-version 5 iOS/Shared/PinnedTLS.swift iOS/Shared/DirectConnectionPolicy.swift "$BUILD_DIR/RoutingFixture.swift" iOS/RoutingSmoke/main.swift -o "$BUILD_DIR/routing-smoke"
          "$BUILD_DIR/routing-smoke" | tee "$BUILD_DIR/routing-tests.log"

      - name: Verify signal freshness and activity compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          state = Path('iOS/Shared/AirSIMLiveActivityShared.swift').read_text().split('enum LiveActivityVisualPolicy', 1)[0]
          state = state.replace('import ActivityKit', '').replace('import AppIntents', '').replace(': ActivityAttributes {', '{')
          models = Path('iOS/AirSIM/APIModels.swift').read_text().split('struct ModemStatus:', 1)[1].split('struct NetworkTrafficSnapshot:', 1)[0]
          Path(os.environ['BUILD_DIR'], 'RadioFixture.swift').write_text(state + '\nstruct ModemStatus:' + models)
          PY
          swiftc -swift-version 5 "$BUILD_DIR/RadioFixture.swift" iOS/RadioActivitySmoke/main.swift -o "$BUILD_DIR/radio-smoke"
          "$BUILD_DIR/radio-smoke" | tee "$BUILD_DIR/radio-tests.log"

      - name: Verify SMS reading state and call outcomes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          source = Path('iOS/AirSIM/APIModels.swift').read_text()
          calls = source.split('struct CallRecord:', 1)[1].split('/// 通话轮询结果', 1)[0]
          messages = source.split('enum SMSDirection:', 1)[1].split('struct SMSStatus:', 1)[0]
          Path(os.environ['BUILD_DIR'], 'PhoneHistoryFixture.swift').write_text('import Foundation\nstruct CallRecord:' + calls + '\nenum SMSDirection:' + messages)
          PY
          swiftc -swift-version 5 "$BUILD_DIR/PhoneHistoryFixture.swift" iOS/PhoneHistorySmoke/main.swift -o "$BUILD_DIR/phone-history-smoke"
          "$BUILD_DIR/phone-history-smoke" | tee "$BUILD_DIR/phone-history-tests.log"

      - name: Verify UDP jitter recovery with actual Swift policy
        shell: bash
        run: |
          set -euo pipefail
          swiftc -swift-version 5 iOS/Shared/UDPOpusJitterBuffer.swift iOS/UDPOpusSmoke/main.swift -o "$BUILD_DIR/udp-jitter-smoke"
          "$BUILD_DIR/udp-jitter-smoke" | tee "$BUILD_DIR/udp-jitter-tests.log"

      - name: Build pinned Opus codec for iPhone
        shell: bash
        run: bash iOS/scripts/build_opus.sh

      - name: Archive for physical iPhone without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project iOS/AirSIM.xcodeproj \
            -scheme AirSIM \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$BUILD_DIR/AirSIM.xcarchive" \
            -derivedDataPath "$BUILD_DIR/DerivedData" \
            -resultBundlePath "$BUILD_DIR/Archive.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            2>&1 | tee "$BUILD_DIR/archive.log"

      - name: Package unsigned IPA with Watch and Live Activity
        shell: bash
        run: |
          set -euo pipefail
          cp iOS/Opus/LICENSE.txt "$BUILD_DIR/AirSIM.xcarchive/Products/Applications/AirSIM.app/Opus-LICENSE.txt"
          python3 iOS/scripts/package_unsigned.py \
            "$BUILD_DIR/AirSIM.xcarchive/Products/Applications/AirSIM.app" \
            "$BUILD_DIR/artifacts" --iphone-only
          cp "$BUILD_DIR/xcode-version.txt" "$BUILD_DIR/artifacts/"
          printf '%s\n' "$GITHUB_SHA" > "$BUILD_DIR/artifacts/source-commit.txt"
          cp iOS/SELF_SIGNING.md "$BUILD_DIR/artifacts/SELF_SIGNING.md"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AirSIM-iPhone-unsigned-${{ github.run_number }}
          path: ${{ env.BUILD_DIR }}/artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AirSIM-iOS-build-log-${{ github.run_number }}
          path: |
            ${{ env.BUILD_DIR }}/archive.log
            ${{ env.BUILD_DIR }}/xcode-version.txt
            ${{ env.BUILD_DIR }}/tls-pin-tests.log
          if-no-files-found: ignore
          retention-days: 7
