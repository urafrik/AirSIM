name: Build unsigned iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'iOS/**'
      - '.github/workflows/ios-unsigned.yml'

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare build directory
        shell: bash
        run: echo "BUILD_DIR=$RUNNER_TEMP/airsim-ios" >> "$GITHUB_ENV"

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP=$(python3 - <<'PY'
          import glob, re
          apps = glob.glob('/Applications/Xcode_26*.app')
          if not apps:
              raise SystemExit('Xcode 26 is required for the existing Liquid Glass UI')
          print(max(apps, key=lambda p: tuple(map(int, re.findall(r'\d+', p)))))
          PY
          )
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
          mkdir -p "$BUILD_DIR"
          xcodebuild -version | tee "$BUILD_DIR/xcode-version.txt"

      - name: Verify certificate pins with real TLS handshakes
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy/direct-frp/generate_self_signed.py --host pin-test.example.test --out "$BUILD_DIR/pin-fixture"
          openssl x509 -in "$BUILD_DIR/pin-fixture/fullchain.pem" -outform DER -out "$BUILD_DIR/pin-fixture/server.der"
          python3 iOS/TLSPinSmoke/server.py "$BUILD_DIR/pin-fixture" &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          swiftc -swift-version 5 iOS/Shared/PinnedTLS.swift iOS/Shared/WatchCallPayload.swift iOS/TLSPinSmoke/main.swift -o "$BUILD_DIR/tls-pin-smoke"
          "$BUILD_DIR/tls-pin-smoke" "$BUILD_DIR/pin-fixture" 2>&1 | tee "$BUILD_DIR/tls-pin-tests.log"

      - name: Archive for physical iPhone without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project iOS/AirSIM.xcodeproj \
            -scheme AirSIM \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$BUILD_DIR/AirSIM.xcarchive" \
            -derivedDataPath "$BUILD_DIR/DerivedData" \
            -resultBundlePath "$BUILD_DIR/Archive.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            2>&1 | tee "$BUILD_DIR/archive.log"

      - name: Package unsigned IPA with Watch and Live Activity
        shell: bash
        run: |
          set -euo pipefail
          python3 iOS/scripts/package_unsigned.py \
            "$BUILD_DIR/AirSIM.xcarchive/Products/Applications/AirSIM.app" \
            "$BUILD_DIR/artifacts"
          cp "$BUILD_DIR/xcode-version.txt" "$BUILD_DIR/artifacts/"
          printf '%s\n' "$GITHUB_SHA" > "$BUILD_DIR/artifacts/source-commit.txt"
          cp iOS/SELF_SIGNING.md "$BUILD_DIR/artifacts/SELF_SIGNING.md"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AirSIM-iPhone-unsigned-${{ github.run_number }}
          path: ${{ env.BUILD_DIR }}/artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AirSIM-iOS-build-log-${{ github.run_number }}
          path: |
            ${{ env.BUILD_DIR }}/archive.log
            ${{ env.BUILD_DIR }}/xcode-version.txt
            ${{ env.BUILD_DIR }}/tls-pin-tests.log
          if-no-files-found: ignore
          retention-days: 7
