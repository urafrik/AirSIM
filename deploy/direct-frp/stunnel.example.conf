; stunnel on the SAME LAN computer as frpc.
; Use absolute paths to your real full certificate chain and private key.
; Example paths below use Windows syntax; change them on Linux/macOS.
client = no
sslVersionMin = TLSv1.2
cert = C:/AirSIM/certs/fullchain.pem
key = C:/AirSIM/certs/privkey.pem

[airsim-control]
accept = 127.0.0.1:17592
connect = 192.168.1.50:7592
TIMEOUTidle = 90

[airsim-pcm]
accept = 127.0.0.1:17593
connect = 192.168.1.50:7593
TIMEOUTidle = 300
